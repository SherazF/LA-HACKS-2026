<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC Build AI Assistant</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="drag-surface" aria-hidden="true">
      <img id="webcam" alt="Camera feed" />
      <canvas id="overlay"></canvas>
    </div>

    <div id="chat-panel">
      <button id="collapse-toggle" type="button" aria-label="Collapse chat panel" aria-expanded="true">
        <span class="chevron" aria-hidden="true">›</span>
      </button>
      <div id="messages" aria-live="polite"></div>
      <div id="input-row">
        <textarea id="chat-input" rows="1" placeholder="Ask about your build..."></textarea>
        <button id="send-btn" type="button">Send</button>
        <button id="voice-btn" type="button" aria-label="Voice input">🎤</button>
      </div>
      <div id="status">Online</div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
